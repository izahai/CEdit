# Fast Snoopy preview using differentiable closed-form SPEED.
sd_ckpt: CompVis/stable-diffusion-v1-4
device: cuda
seed: 0

target_concepts:
  - Snoopy
anchor_concepts:
  - ""
retain_path: data/instance.csv
heads: concept
baseline: SPEED
params: V
anchor_mode: legacy
aug_num: 0
erase_style: false

# Fixed rank overrides threshold when set.
retain_projection_rank: 150
threshold: 0.1
retain_scale: 100.0
residual_scale: 1.0
lamb: 0.0
use_k2: false
use_null_retain_loss: true

anchor_steps: 20
anchor_lr: 0.01
anchor_batch_size: 1
max_anchor_norm: target
cosine_eps: 1.0e-8
num_inference_steps: 8
guidance_scale: 3.0
resolution: 512

# Minimal validation: initial state and final step only.
validation_seed: 10000
validation_samples: 1
validation_interval: 9999
optimization_prompts_path: null
validation_prompts_path: null

save_path: logs/closed_form_backprop/snoopy_preview
file_name: weight
