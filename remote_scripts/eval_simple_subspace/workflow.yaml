# Runtime used by every workflow step.
runtime:
  python_bin: /venv/main/bin/python
  gpu_id: 0

# Source repositories used by 00_clone_repositories.sh.
repositories:
  cedit_branch: main
  cedit_repository: https://github.com/izahai/CEdit.git
  ce_eval_repository: https://github.com/izahai/CE-Eval.git
  ce_eval_branch: main

experiment:
  sd_ckpt: CompVis/stable-diffusion-v1-4
  anchor_mode: negative_target_normalized_residual_subspace
  benchmark_names:
    - 10_celebrity
    - 50_celebrity
    - 100_celebrity
  config_names:
    - config_1
    - config_2
  batch_size: 10
  expected_images_per_split: 500
  gcd_use_cuda: true

# ${WORKSPACE_DIR} is calculated by common.sh. Override OUTPUT_ROOT at runtime
# when a Vast persistent volume is mounted elsewhere.
paths:
  ce_eval_root: ${WORKSPACE_DIR}/CE-Eval
  output_root: ${WORKSPACE_DIR}/cedit_ce_eval_outputs_eval_multi_1
