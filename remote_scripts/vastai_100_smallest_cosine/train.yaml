# Erasure method
anchor_concepts:
  - person
anchor_mode: smallest_cosine_subspace
residual_top_k: 20
residual_scale: 1.0

# SPEED hyperparameters
baseline: SPEED
params: V
aug_num: 0
threshold: 0.1
retain_scale: 0.05
lamb: 0.0
disable_filter: true

# Retain set
retain_path: data/100_celebrity.csv
heads: concept

# 02_train.sh exports this path from workflow.yaml before loading the YAML.
save_path: ${CHECKPOINT_DIR}
file_name: weight
