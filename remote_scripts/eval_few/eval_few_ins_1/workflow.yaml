# Full instance comparison derived from scripts/eval_few.sh.
runtime:
  python_bin: /venv/main/bin/python
  gpu_id: 0

experiment:
  sd_ckpt: CompVis/stable-diffusion-v1-4
  methods:
    - original
    - legacy
    - target_global_pairwise_residual_subspace
  edited_methods:
    - legacy
    - target_global_pairwise_residual_subspace
  seed: 0
  inference_timesteps: 20
  guidance_scale: 7.5
  num_samples_per_prompt: 10
  batch_size: 10
  mscoco_num_prompts: 1000
  mscoco_batch_size: 10
  clip_batch_size: 32
  fid_batch_size: 32
  fid_feature_layer: 2048
  clip_model: openai/clip-vit-large-patch14

domains:
  instance:
    contents:
      - Snoopy
      - Mickey
      - Spongebob
      - Pikachu
      - Hello Kitty
tasks:
  - id: snoopy
    erase_type: instance
    target_concepts:
      - Snoopy
    anchor_concept: ""
  - id: snoopy_mickey
    erase_type: instance
    target_concepts:
      - Snoopy
      - Mickey
    anchor_concept: ""
  - id: snoopy_mickey_spongebob
    erase_type: instance
    target_concepts:
      - Snoopy
      - Mickey
      - Spongebob
    anchor_concept: ""
paths:
  output_root: ${WORKSPACE_DIR}/cedit_eval_few_ins_1
