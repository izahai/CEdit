# Small end-to-end validation of an instance null-anchor task.
runtime:
  python_bin: /venv/main/bin/python
  gpu_id: 0

experiment:
  sd_ckpt: CompVis/stable-diffusion-v1-4
  methods:
    - original
    - legacy
    - target_global_pairwise_residual_subspace
  edited_methods:
    - legacy
    - target_global_pairwise_residual_subspace
  seed: 0
  inference_timesteps: 20
  guidance_scale: 7.5
  num_samples_per_prompt: 10
  batch_size: 10
  mscoco_num_prompts: 10
  mscoco_batch_size: 10
  clip_batch_size: 10
  fid_batch_size: 10
  fid_feature_layer: 64
  clip_model: openai/clip-vit-large-patch14

domains:
  instance:
    contents:
      - Snoopy
      - Pikachu
    prompt_templates:
      - a photo of a {}.
tasks:
  - id: snoopy
    erase_type: instance
    target_concepts:
      - Snoopy
    anchor_concept: ""
paths:
  output_root: ${WORKSPACE_DIR}/cedit_eval_few_ins_1_smoke
